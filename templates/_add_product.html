
<div id="addProductWrapper">

    <!-- SUCCESS / ERROR MESSAGES -->
    <div id="addProductMessages" aria-live="polite" class="mb-3"></div>

    <form method="POST"
          action="{{ url_for('add_product') }}"
          enctype="multipart/form-data"
          id="productForm"
          novalidate>

        {% if csrf_token is defined %}
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        {% endif %}

        <div class="row g-4">

            <!-- LEFT COLUMN -->
            <div class="col-lg-8">

                <!-- BASIC INFORMATION -->
                <div class="card border-0 shadow-sm mb-4">

                    <div class="card-header bg-white py-3 border-bottom">
                        <h5 class="mb-0 fw-semibold text-primary">
                            <i class="fas fa-info-circle me-2"></i>
                            Basic Information
                        </h5>
                    </div>

                    <div class="card-body p-4">

                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">
                                Product Name <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                   class="form-control form-control-lg"
                                   id="name"
                                   name="name"
                                   maxlength="150"
                                   placeholder="e.g. Wireless Headphones"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="category_id" class="form-label fw-semibold">
                                Category
                            </label>

                            <select class="form-select form-select-lg"
                                    id="category_id"
                                    name="category_id">

                                <option value="">— Select category —</option>

                                {% for category in categories %}
                                    <option value="{{ category.id }}">
                                        {{ category.name }}
                                    </option>
                                {% endfor %}

                            </select>
                        </div>

                        <div class="mb-0">
                            <label for="description" class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea class="form-control"
                                      id="description"
                                      name="description"
                                      rows="4"
                                      placeholder="Describe your product..."
                                      maxlength="10000"></textarea>
                        </div>

                    </div>
                </div>

                <!-- PRICING AND INVENTORY -->
                <div class="card border-0 shadow-sm mb-4">

                    <div class="card-header bg-white py-3 border-bottom">
                        <h5 class="mb-0 fw-semibold text-primary">
                            <i class="fas fa-tags me-2"></i>
                            Pricing &amp; Inventory
                        </h5>
                    </div>

                    <div class="card-body p-4">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="price" class="form-label fw-semibold">
                                    Price (ETB) <span class="text-danger">*</span>
                                </label>

                                <div class="input-group input-group-lg">
                                    <span class="input-group-text bg-light">Br</span>

                                    <input type="number"
                                           class="form-control"
                                           id="price"
                                           name="price"
                                           min="0.01"
                                           step="0.01"
                                           placeholder="0.00"
                                           required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="stock" class="form-label fw-semibold">
                                    Stock <span class="text-danger">*</span>
                                </label>

                                <input type="number"
                                       class="form-control form-control-lg"
                                       id="stock"
                                       name="stock"
                                       min="0"
                                       step="1"
                                       value="0"
                                       required>
                            </div>

                            <div class="col-md-6">
                                <label for="icon" class="form-label fw-semibold">
                                    Icon (emoji)
                                </label>

                                <input type="text"
                                       class="form-control form-control-lg"
                                       id="icon"
                                       name="icon"
                                       value="📦"
                                       maxlength="50">
                            </div>

                            <div class="col-md-6">
                                <label for="tag" class="form-label fw-semibold">
                                    Tag
                                </label>

                                <input type="text"
                                       class="form-control form-control-lg"
                                       id="tag"
                                       name="tag"
                                       placeholder="New Arrival"
                                       maxlength="50">
                            </div>

                        </div>
                    </div>
                </div>

            </div>

            <!-- RIGHT COLUMN -->
            <div class="col-lg-4">

                <!-- PRODUCT IMAGE -->
                <div class="card border-0 shadow-sm mb-4">

                    <div class="card-header bg-white py-3 border-bottom">
                        <h5 class="mb-0 fw-semibold text-primary">
                            <i class="fas fa-image me-2"></i>
                            Product Image
                        </h5>
                    </div>

                    <div class="card-body p-4">

                        <!-- UPLOAD ZONE -->
                        <label for="image"
                               id="uploadZone"
                               class="text-center p-4 rounded border border-2 border-dashed w-100 d-block"
                               style="cursor:pointer;background:#f8fafc;">

                            <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i>

                            <h6 class="fw-bold mb-1 text-dark">
                                Click to upload
                            </h6>

                            <p class="text-muted small mb-0">
                                JPG, PNG, WEBP (Max 5MB)
                            </p>

                            <input type="file"
                                   id="image"
                                   name="image"
                                   accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                                   style="display:none;">
                        </label>

                        <!-- IMAGE PREVIEW -->
                        <div id="previewContainer"
                             class="text-center mt-3"
                             style="display:none;">

                            <div class="border rounded p-2 bg-light">

                                <img id="imagePreview"
                                     src=""
                                     alt="Product image preview"
                                     class="img-fluid rounded"
                                     style="width:100%;height:200px;object-fit:contain;">

                            </div>

                            <div class="mt-2 text-muted small text-break"
                                 id="imageName"></div>

                            <div class="text-success small mt-1">
                                <i class="fas fa-check-circle me-1"></i>
                                Image selected successfully
                            </div>

                            <button type="button"
                                    class="btn btn-sm btn-outline-danger mt-2"
                                    id="removeImageBtn">

                                <i class="fas fa-trash me-1"></i>
                                Remove Image

                            </button>

                        </div>

                        <!-- IMAGE ERROR -->
                        <div id="imageError"
                             class="text-danger small mt-2"
                             role="alert"
                             style="display:none;">
                        </div>

                    </div>
                </div>

                <!-- ACTION BUTTONS -->
                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4 d-grid gap-2">

                        <button type="submit"
                                class="btn btn-primary btn-lg"
                                id="saveButton">

                            <i class="fas fa-save me-2"></i>
                            Save Product

                        </button>

                        <button type="reset"
                                class="btn btn-outline-secondary"
                                id="clearProductButton">

                            <i class="fas fa-eraser me-2"></i>
                            Clear Form

                        </button>

                        <a href="{{ url_for('admin_products') }}"
                           class="btn btn-link text-muted">

                            Cancel

                        </a>

                    </div>
                </div>

            </div>

        </div>

    </form>

</div>

<!-- IMAGE PREVIEW JAVASCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const imageInput = document.getElementById("image");
    const previewContainer = document.getElementById("previewContainer");
    const imagePreview = document.getElementById("imagePreview");
    const imageName = document.getElementById("imageName");
    const removeImageBtn = document.getElementById("removeImageBtn");
    const uploadZone = document.getElementById("uploadZone");
    const imageError = document.getElementById("imageError");
    const productForm = document.getElementById("productForm");

    let currentImageURL = null;

    const allowedTypes = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    function showError(message) {
        imageError.textContent = message;
        imageError.style.display = "block";
    }

    function hideError() {
        imageError.textContent = "";
        imageError.style.display = "none";
    }

    function clearPreview() {

        if (currentImageURL) {
            URL.revokeObjectURL(currentImageURL);
            currentImageURL = null;
        }

        imagePreview.src = "";
        imageName.textContent = "";

        previewContainer.style.display = "none";
        uploadZone.style.display = "block";

        hideError();
    }

    // DISPLAY SELECTED IMAGE
    imageInput.addEventListener("change", function () {

        hideError();

        const file = this.files[0];

        if (!file) {
            clearPreview();
            return;
        }

        // Validate image type
        if (!allowedTypes.includes(file.type)) {

            this.value = "";

            clearPreview();

            showError("Only JPG, JPEG, PNG and WEBP images are allowed.");

            return;
        }

        // Validate maximum file size: 5MB
        if (file.size > 5 * 1024 * 1024) {

            this.value = "";

            clearPreview();

            showError("Image size must not exceed 5MB.");

            return;
        }

        // Release previous preview
        if (currentImageURL) {
            URL.revokeObjectURL(currentImageURL);
        }

        // Create browser preview
        currentImageURL = URL.createObjectURL(file);

        imagePreview.src = currentImageURL;

        imageName.textContent =
            file.name + " (" + (file.size / (1024 * 1024)).toFixed(2) + " MB)";

        previewContainer.style.display = "block";
        uploadZone.style.display = "none";

    });

    // REMOVE SELECTED IMAGE
    removeImageBtn.addEventListener("click", function () {

        imageInput.value = "";

        clearPreview();

    });

    // CLEAR FORM
    productForm.addEventListener("reset", function () {

        setTimeout(function () {

            clearPreview();

        }, 0);

    });

});
</script>
