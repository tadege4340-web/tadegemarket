
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ShopNova</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #101d36, #087f8c);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #142d47;
            margin-bottom: 10px;
        }

        .logo span {
            color: #00a6a6;
        }

        h2 {
            text-align: center;
            color: #142d47;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #26374a;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00a6a6;
            box-shadow: 0 0 0 3px rgba(0, 166, 166, 0.12);
        }

        /* Password visibility styling */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
            color: #008f91;
            padding: 5px;
        }

        .register-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #00a6a6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-button:hover {
            background: #087f8c;
        }

        .message {
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #ffe6e6;
            color: #b42318;
        }

        .success {
            background: #e3f8e9;
            color: #16743b;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #008f91;
            text-decoration: none;
            font-weight: bold;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
            color: #142d47;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="logo">
            Shop<span>Nova</span>.
        </div>

        <h2>Create Your Account</h2>

        <p class="subtitle">
            Join ShopNova and start discovering great products.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <div class="form-group">
                <label for="full_name">Full Name</label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    value="{{ request.form.get('full_name', '') }}"
                    maxlength="150"
                    autocomplete="name"
                    required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    value="{{ request.form.get('username', '') }}"
                    maxlength="80"
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    value="{{ request.form.get('email', '') }}"
                    maxlength="150"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password">
                        <span class="eye-icon">👁</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Enter your password again"
                        minlength="8"
                        autocomplete="new-password"
                        required>

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirm_password', this)"
                        aria-label="Show password">
                        <span class="eye-icon">👁</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="register-button">
                Create Account
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

        <a href="{{ url_for('home') }}" class="back-home">
            ← Back to ShopNova Home
        </a>

    </div>

    <script>
        function togglePassword(inputId, button) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = button.querySelector(".eye-icon");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.textContent = "🙈";
                button.setAttribute("aria-label", "Hide password");
            } else {
                passwordInput.type = "password";
                eyeIcon.textContent = "👁";
                button.setAttribute("aria-label", "Show password");
            }
        }
    </script>

</body>
</html>
